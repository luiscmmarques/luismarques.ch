<!doctype html>
<!--
  Source for public/og.png, the link preview card. Not part of the site build,
  so nothing here ships to dist/. It mirrors the status banner and hero of the
  real page, at the 1200x630 that social scrapers expect.

  Regenerate after changing the name, title or theme:
    npx playwright@latest screenshot --viewport-size=1200,630 \
      tools/og-card.html public/og.png
    python3 tools/og-optimize.py

  The card is nearly flat colour, so the second step palettes it down from
  around 210 KB to around 70 KB with no visible difference. Chat apps fetch
  this file on every shared link, so the smaller version is the one to commit.

  The avatar is inlined by the screenshot from public/, so run it from the repo root.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>luismarques.ch link preview card</title>
    <style>
      :root {
        --bg: #05070d;
        --text: #e8edf7;
        --muted: #94a0b8;
        --accent: #4d8dff;
        --orange: #ff8b3d;
        --ok: #3ddc97;
        --ok-bg: rgba(61, 220, 151, 0.12);
        --border: rgba(120, 160, 255, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }
      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
        /* Same kiro-style backdrop as the site: soft radial glows over a faint grid. */
        background-image:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(41, 121, 255, 0.22), transparent 70%),
          radial-gradient(ellipse 50% 35% at 85% 20%, rgba(255, 109, 0, 0.07), transparent 70%),
          linear-gradient(rgba(120, 160, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120, 160, 255, 0.05) 1px, transparent 1px);
        background-size: auto, auto, 44px 44px, 44px 44px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 30px;
        font-weight: 700;
      }
      .brand img {
        width: 48px;
        height: 48px;
      }
      .brand-thin {
        color: var(--muted);
        font-weight: 400;
      }
      .banner {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 18px 28px;
        border-radius: 16px;
        background: linear-gradient(90deg, rgba(61, 220, 151, 0.16), rgba(61, 220, 151, 0.05));
        border: 1px solid rgba(61, 220, 151, 0.35);
        color: var(--ok);
        font-weight: 700;
        font-size: 38px;
        align-self: flex-start;
      }
      .banner-dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 24px var(--ok);
      }
      .who {
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .who img {
        width: 132px;
        height: 132px;
        border-radius: 50%;
        border: 2px solid var(--border);
        object-fit: cover;
      }
      h1 {
        margin: 0;
        font-size: 60px;
        letter-spacing: -0.02em;
      }
      .role {
        margin: 6px 0 0;
        /* Sized so the full title with both acronyms still fits on one line. */
        font-size: 25px;
        color: var(--accent);
        font-weight: 600;
      }
      .meta {
        display: flex;
        gap: 26px;
        align-items: center;
        font-size: 23px;
        color: var(--muted);
      }
      .meta strong {
        color: var(--text);
      }
      .url {
        color: var(--orange);
        font-weight: 700;
      }
      .flagged {
        display: inline-flex;
        align-items: center;
        gap: 9px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="../public/logo.svg" alt="" />
      <span>luís marques <span class="brand-thin">/ status</span></span>
    </div>

    <div>
      <div class="banner"><span class="banner-dot"></span> All Systems Operational</div>
      <div class="who" style="margin-top: 36px">
        <img src="../public/luis-sm.jpg" alt="" />
        <div>
          <h1>Luís Marques</h1>
          <p class="role">Technical Account Manager (TAM) @ Amazon Web Services (AWS)</p>
        </div>
      </div>
    </div>

    <div class="meta">
      <span class="url">luismarques.ch</span>
      <span>Uptime <strong>100%</strong></span>
      <span class="flagged">
        <!-- Same flags as the Region metric and the incident log on the page. -->
        <svg viewBox="0 0 32 32" width="22" height="22">
          <rect width="32" height="32" rx="6" fill="#d52b1e" />
          <rect x="13" y="7" width="6" height="18" fill="#fff" />
          <rect x="7" y="13" width="18" height="6" fill="#fff" />
        </svg>
        Region <strong>eu-alps-1</strong>
      </span>
      <span class="flagged">
        <svg viewBox="0 0 32 32" width="22" height="22">
          <rect width="32" height="32" rx="6" fill="#da291c" />
          <path d="M6 0h7v32H6z" fill="#046a38" />
          <path d="M0 6a6 6 0 0 1 6-6v32a6 6 0 0 1-6-6z" fill="#046a38" />
          <circle cx="13" cy="16" r="6" fill="#ffd200" />
          <circle cx="13" cy="16" r="3.2" fill="#fff" />
          <circle cx="13" cy="16" r="1.5" fill="#da291c" />
        </svg>
        Booted <strong>1988</strong>
      </span>
      <span>Open incidents <strong>0</strong></span>
    </div>
  </body>
</html>
